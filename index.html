<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soundarya Lahari — sung by Swetha Balaji</title>
<meta name="theme-color" content="#23101A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soundarya Lahari">

<link rel="manifest" href="manifest.webmanifest">

<style>
/* ============================================================
   FONTS
   Karla and Tiro Devanagari Sanskrit, both Open Font License,
   stored in fonts/ so the page makes no outside connections
   and keeps working with no internet.
   ============================================================ */
@font-face{
  font-family:"Karla"; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/karla-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face{
  font-family:"Karla"; font-style:normal; font-weight:400 700; font-display:swap;
  src:url(fonts/karla-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Tiro Devanagari Sanskrit"; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tiro-devanagari.woff2) format("woff2");
  unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF;
}
@font-face{
  font-family:"Tiro Devanagari Sanskrit"; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tiro-latin-ext.woff2) format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face{
  font-family:"Tiro Devanagari Sanskrit"; font-style:normal; font-weight:400; font-display:swap;
  src:url(fonts/tiro-latin.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

/* ============================================================
   COLOURS AND FONTS
   Change anything here to restyle the whole site.
   ============================================================ */
:root{
  --ground:#23101A;
  --surface:#2F1622;
  --surface-2:#3A1C2A;
  --line:#4E2836;
  --gold:#E5AE4E;
  --gold-dim:#8E6A31;
  --vermilion:#E2593F;
  --conch:#F6EADC;
  --muted:#B4908C;

  --display:"Tiro Devanagari Sanskrit", Georgia, serif;
  --ui:"Karla", system-ui, -apple-system, sans-serif;

  --player-h:206px;
}

*{box-sizing:border-box;margin:0;padding:0}

html{-webkit-text-size-adjust:100%}

body{
  background:var(--ground);
  color:var(--conch);
  font-family:var(--ui);
  font-size:16px;
  line-height:1.5;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}

/* subtle vertical warmth, like lamplight in a shrine */
body::before{
  content:"";
  position:fixed; inset:0;
  background:radial-gradient(120% 70% at 50% -10%, rgba(229,174,78,.10), transparent 60%);
  pointer-events:none;
  z-index:0;
}

.wrap{
  position:relative;
  z-index:1;
  max-width:760px;
  margin:0 auto;
  padding:0 18px calc(var(--player-h) + 40px);
}

/* ---------- header ---------- */
.masthead{
  display:flex;
  align-items:center;
  gap:14px;
  padding:26px 0 20px;
}
.yantra{width:44px;height:44px;flex:0 0 44px}
.masthead h1{
  font-family:var(--display);
  font-weight:400;
  font-size:26px;
  line-height:1.1;
  letter-spacing:.01em;
}
.masthead p{
  font-size:12.5px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--gold);
  margin-top:5px;
}

/* ---------- playlist tabs ---------- */
.tabs{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 18px 14px;
  margin:0 -18px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}

.tab{
  flex:0 0 auto;
  font-family:var(--ui);
  font-size:14px;
  font-weight:600;
  color:var(--muted);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:999px;
  padding:8px 15px;
  cursor:pointer;
  white-space:nowrap;
  transition:color .16s, background .16s, border-color .16s;
}
.tab:hover{color:var(--conch)}
.tab[aria-selected="true"]{
  background:var(--gold);
  border-color:var(--gold);
  color:#2A1206;
}
.tab .count{opacity:.55; font-weight:500; margin-left:5px}

/* ---------- search ---------- */
.search{
  width:100%;
  font-family:var(--ui);
  font-size:15px;
  color:var(--conch);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px 14px;
  margin-bottom:16px;
}
.search::placeholder{color:var(--muted)}
.search:focus{outline:2px solid var(--gold); outline-offset:1px}

/* ---------- track list ---------- */
.list{list-style:none}

.track{
  display:flex;
  align-items:center;
  gap:14px;
  width:100%;
  text-align:left;
  background:none;
  border:0;
  border-bottom:1px solid var(--line);
  color:inherit;
  font-family:var(--ui);
  padding:13px 6px;
  cursor:pointer;
}
.track:hover{background:rgba(255,255,255,.03)}
.track:focus-visible{outline:2px solid var(--gold); outline-offset:-2px}

.num{
  flex:0 0 38px;
  font-family:var(--display);
  font-size:17px;
  color:var(--gold-dim);
  text-align:center;
  font-variant-numeric:tabular-nums;
}
.track[aria-current="true"] .num{color:var(--gold)}

.meta{flex:1; min-width:0}
.title{
  font-size:15.5px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.track[aria-current="true"] .title{color:var(--gold)}
.tagline{
  font-size:12px;
  color:var(--muted);
  margin-top:2px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.star{color:var(--vermilion); margin-right:5px}

/* the two openers that begin every theme playlist */
.opening{
  color:var(--gold-dim);
  font-size:11px;
  letter-spacing:.09em;
  text-transform:uppercase;
}
.track.opener .num{color:var(--gold-dim)}
.track.lastopener{border-bottom:0}
.openrule{
  height:0;
  border-bottom:1px dashed var(--gold-dim);
  opacity:.5;
  margin:0 6px;
}

/* animated bars on the playing row */
.bars{flex:0 0 15px; height:15px; display:flex; align-items:flex-end; gap:2px; opacity:0}
.track[aria-current="true"] .bars{opacity:1}
.bars i{display:block; width:3px; background:var(--gold); height:30%}
.playing .bars i{animation:bounce .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}
.bars i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{height:25%}50%{height:100%}}

.empty{
  text-align:center;
  color:var(--muted);
  padding:56px 20px;
  font-size:15px;
}
.empty strong{display:block; color:var(--conch); font-size:17px; margin-bottom:8px; font-family:var(--display); font-weight:400}
.empty code{
  background:var(--surface-2); padding:2px 6px; border-radius:4px;
  font-size:13px; color:var(--gold);
}

.offline{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:10px;
  padding:9px 12px;
  margin-bottom:16px;
}
.offline-text{font-size:12.5px; color:var(--muted)}
.offline-text b{color:var(--gold); font-weight:600}
.offline-btn{
  font-family:var(--ui);
  font-size:12.5px;
  font-weight:600;
  color:var(--gold);
  background:none;
  border:1px solid var(--gold-dim);
  border-radius:999px;
  padding:5px 13px;
  cursor:pointer;
  white-space:nowrap;
  transition:background .15s, color .15s;
}
.offline-btn:hover:not(:disabled){background:var(--gold); color:#2A1206; border-color:var(--gold)}
.offline-btn:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
.offline-btn:disabled{opacity:.45; cursor:default}
.offline-btn[hidden]{display:none}

.notice{
  background:var(--surface-2);
  border:1px solid var(--line);
  border-left:3px solid var(--vermilion);
  border-radius:8px;
  padding:11px 14px;
  font-size:13.5px;
  color:var(--muted);
  margin-bottom:16px;
}

/* ============================================================
   PLAYER
   ============================================================ */
.player{
  position:fixed;
  left:0; right:0; bottom:0;
  z-index:20;
  background:rgba(35,16,26,.94);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.player-inner{max-width:760px; margin:0 auto; padding:12px 18px 14px}

.now{display:flex; align-items:baseline; gap:9px; margin-bottom:9px; min-height:22px}
.now .n{font-family:var(--display); color:var(--gold); font-size:15px; flex:0 0 auto}
.now .t{
  font-size:14.5px; font-weight:500;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.now .idle{color:var(--muted); font-weight:400}

/* ---------- seek ---------- */
.seek-row{display:flex; align-items:center; gap:10px}
.time{
  font-size:11.5px; color:var(--muted);
  font-variant-numeric:tabular-nums; flex:0 0 auto;
}
.seek-wrap{position:relative; flex:1; height:22px; display:flex; align-items:center}

input[type=range]{
  -webkit-appearance:none; appearance:none;
  width:100%; background:transparent; margin:0; cursor:pointer;
}
input[type=range]::-webkit-slider-runnable-track{
  height:4px; border-radius:2px; background:var(--line);
}
input[type=range]::-moz-range-track{
  height:4px; border-radius:2px; background:var(--line);
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none; appearance:none;
  width:14px; height:14px; border-radius:50%;
  background:var(--gold); border:0; margin-top:-5px;
}
input[type=range]::-moz-range-thumb{
  width:14px; height:14px; border-radius:50%;
  background:var(--gold); border:0;
}
input[type=range]:focus-visible{outline:2px solid var(--gold); outline-offset:4px}

/* A / B markers floating over the seek bar */
.marker{
  position:absolute; top:3px; width:2px; height:16px;
  background:var(--vermilion); pointer-events:none; display:none;
}
.marker.on{display:block}
.marker::after{
  content:attr(data-l);
  position:absolute; top:-13px; left:50%; transform:translateX(-50%);
  font-size:9px; font-weight:700; color:var(--vermilion);
}

/* ---------- transport ---------- */
.transport{
  display:flex; align-items:center; justify-content:center;
  gap:6px; margin:8px 0 4px;
}
.btn{
  display:grid; place-items:center;
  background:none; border:0; color:var(--conch);
  width:42px; height:42px; border-radius:10px;
  cursor:pointer; transition:background .15s, color .15s;
}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible{outline:2px solid var(--gold); outline-offset:1px}
.btn:disabled{opacity:.3; cursor:default}
.btn:disabled:hover{background:none}
.btn svg{width:21px; height:21px; fill:currentColor}
.btn[aria-pressed="true"]{color:var(--gold); background:var(--surface-2)}

.btn-play{
  width:54px; height:54px; border-radius:50%;
  background:var(--gold); color:#2A1206; margin:0 4px;
}
.btn-play:hover{background:#F0BC5E}
.btn-play svg{width:25px; height:25px}

.ab{
  font-family:var(--ui); font-size:12.5px; font-weight:700;
  width:auto; min-width:34px; padding:0 9px; height:34px;
  border:1px solid var(--line); border-radius:8px; color:var(--muted);
}
.ab[aria-pressed="true"]{color:var(--vermilion); border-color:var(--vermilion); background:none}
.ab-group{display:flex; gap:5px; margin-left:6px}

/* ---------- laya (tempo) — the signature control ---------- */
.laya{
  border-top:1px solid var(--line);
  margin-top:10px; padding-top:11px;
}
.laya-head{
  display:flex; justify-content:space-between; align-items:baseline;
  margin-bottom:5px;
}
.laya-head span:first-child{
  font-family:var(--display); font-size:13px;
  color:var(--muted); letter-spacing:.05em;
}
.laya-head .rate{
  font-size:13px; font-weight:700; color:var(--gold);
  font-variant-numeric:tabular-nums;
}
.laya-scale{
  display:flex; justify-content:space-between;
  font-size:10px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--gold-dim); margin-top:6px;
}

@media(min-width:560px){
  .masthead h1{font-size:31px}
  .wrap{padding-left:24px; padding-right:24px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>

<body>
<div class="wrap">

  <header class="masthead">
    <svg class="yantra" viewBox="0 0 100 100" aria-hidden="true" fill="none"
         stroke="var(--gold)" stroke-width="1.6">
      <circle cx="50" cy="50" r="46" opacity=".45"/>
      <circle cx="50" cy="50" r="38"/>
      <path d="M50 16 L79 66 L21 66 Z"/>
      <path d="M50 84 L21 34 L79 34 Z"/>
      <path d="M50 30 L68 61 L32 61 Z" opacity=".7"/>
      <path d="M50 70 L32 39 L68 39 Z" opacity=".7"/>
      <circle cx="50" cy="50" r="3" fill="var(--vermilion)" stroke="none"/>
    </svg>
    <div>
      <h1>Soundarya Lahari</h1>
      <p>Sung by Swetha Balaji</p>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist" aria-label="Playlists"></div>

  <input class="search" id="search" type="search" placeholder="Search by name or number" aria-label="Search slokams">

  <div class="offline" id="offline" hidden>
    <span class="offline-text" id="offlineText"></span>
    <button class="offline-btn" id="saveAll">Save all for offline</button>
  </div>

  <div id="notice"></div>
  <ul class="list" id="list"></ul>

</div>

<!-- ============================ PLAYER ============================ -->
<div class="player">
  <div class="player-inner">

    <div class="now">
      <span class="n" id="nowNum"></span>
      <span class="t idle" id="nowTitle">Choose a slokam to begin</span>
    </div>

    <div class="seek-row">
      <span class="time" id="cur">0:00</span>
      <div class="seek-wrap">
        <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Position">
        <div class="marker" id="markA" data-l="A"></div>
        <div class="marker" id="markB" data-l="B"></div>
      </div>
      <span class="time" id="dur">0:00</span>
    </div>

    <div class="transport">
      <button class="btn" id="prev" aria-label="Previous slokam">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3 6l9-6v12z"/></svg>
      </button>

      <button class="btn btn-play" id="play" aria-label="Play">
        <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="btn" id="next" aria-label="Next slokam">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18V6l9 6z"/></svg>
      </button>

      <button class="btn" id="loop" aria-pressed="false" aria-label="Repeat this slokam" title="Repeat this slokam">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>

      <button class="btn" id="dl" aria-label="Download this slokam" title="Download">
        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
      </button>

      <span class="ab-group">
        <button class="btn ab" id="setA" aria-pressed="false" title="Mark the start of a loop">A</button>
        <button class="btn ab" id="setB" aria-pressed="false" title="Mark the end of a loop">B</button>
      </span>
    </div>

    <div class="laya">
      <div class="laya-head">
        <span>laya · speed</span>
        <span class="rate" id="rateLabel">1.00&times;</span>
      </div>
      <input type="range" id="rate" min="0" max="7" step="1" value="5" aria-label="Playback speed">
      <div class="laya-scale">
        <span>vilambita</span><span>madhyama</span><span>druta</span>
      </div>
    </div>

  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ================================================================
   SETTINGS — you will almost never need to change these.
   ================================================================ */
const AUDIO_FOLDER = "audio";   // folder holding the recordings
const AUDIO_TYPE   = "m4a";     // file extension of the recordings
const SINGER       = "Swetha Balaji";

/* The dhyanam is stored as 00.m4a but is never called "Slokam 00"
   anywhere a student can see. Its public name is set here. */
const DHYANAM_NUM   = "0";
const DHYANAM_NAME  = "Dhyanam Slokam";
const DHYANAM_MARK  = "ॐ";              /* the om shown in the number column */

/* Every theme playlist opens with these, in this order, automatically.
   You never tag them; the app puts them there. */
const OPENER_NUMS   = ["0", "1"];

/* Speeds the laya slider steps through. Pitch stays natural. */
const SPEEDS = [0.50, 0.60, 0.70, 0.80, 0.90, 1.00, 1.10, 1.25];

/* Shown only if songs.txt cannot be read (for example when this file
   is opened straight from your computer instead of from the web). */
const DEMO = `1 | Shivah shaktya yukto | important
22 | Bhavani tvam dase | important, career
36 | Tava svadhishthane | eyesight`;

/* ================================================================
   Reading songs.txt
   Each line:   number | title | tag, tag, tag
   Lines starting with # are ignored.
   ================================================================ */
function parseSongs(text){
  const out = [];
  text.split("\n").forEach(raw => {
    const line = raw.trim();
    if(!line || line.startsWith("#")) return;

    const bits = line.split("|").map(s => s.trim());
    const num  = bits[0];
    if(!num) return;

    const tags = (bits[2] || "")
      .split(",").map(s => s.trim().toLowerCase()).filter(Boolean);

    const pad  = num.length < 2 ? "0" + num : num;
    const file = bits[3] || `${AUDIO_FOLDER}/${pad}.${AUDIO_TYPE}`;

    // what this slokam is called out loud: "Dhyanam Slokam", "Slokam 07"
    const name  = num === DHYANAM_NUM ? DHYANAM_NAME : `Slokam ${pad}`;
    // what shows in the narrow number column
    const badge = num === DHYANAM_NUM ? DHYANAM_MARK : pad;
    const title = bits[1] || "";

    out.push({
      num, pad, name, badge, title,
      shown: title || name,          // the line a student reads
      tags,
      file,
      key: (pad + " " + name + " " + title).toLowerCase()
    });
  });
  return out;
}

/* Keep any stray < & " in a title from breaking the page */
function esc(str){
  return String(str).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

/* Turn a tag like "eye-sight" into a tab label like "Eye Sight" */
function label(tag){
  return tag.replace(/[-_]/g, " ")
            .replace(/\b\w/g, c => c.toUpperCase());
}

/* ================================================================
   State
   ================================================================ */
let SONGS = [], TABS = [], view = [], tab = "all", idx = -1;
let aPoint = null, bPoint = null, seeking = false;

const $ = id => document.getElementById(id);
const audio = $("audio");

audio.preservesPitch = true;
audio.mozPreservesPitch = true;
audio.webkitPreservesPitch = true;

/* ================================================================
   Building the tabs
   ================================================================ */
function buildTabs(){
  const seen = [];
  SONGS.forEach(s => s.tags.forEach(t => { if(!seen.includes(t)) seen.push(t); }));

  // "important" always sits first, right after All
  const rest = seen.filter(t => t !== "important");
  TABS = [{id:"all", name:"All"}];
  if(seen.includes("important")) TABS.push({id:"important", name:"Important"});
  rest.forEach(t => TABS.push({id:t, name:label(t)}));

  $("tabs").innerHTML = TABS.map(t => {
    const n = t.id === "all" ? SONGS.length
                             : SONGS.filter(s => s.tags.includes(t.id)).length;
    return `<button class="tab" role="tab" data-tab="${t.id}"
              aria-selected="${t.id === tab}">${t.name}<span class="count">${n}</span></button>`;
  }).join("");

  $("tabs").querySelectorAll(".tab").forEach(b => {
    b.onclick = () => { tab = b.dataset.tab; buildTabs(); render(); };
  });
}

/* ================================================================
   Building the list
   ================================================================ */
/* The dhyanam and the first slokam, in that order, if they exist. */
function openingPair(){
  return OPENER_NUMS.map(n => SONGS.find(s => s.num === n)).filter(Boolean);
}

let openCount = 0;   // how many rows at the top are automatic openers

function render(){
  const q = $("search").value.trim().toLowerCase();

  let rows = SONGS
    .filter(s => tab === "all" || s.tags.includes(tab))
    .filter(s => !q || s.key.includes(q));

  /* Every theme playlist begins with the dhyanam and slokam 01.
     Not while searching — then the list should only answer the search.
     "All" needs no help: 00 and 01 already sort to the top. */
  openCount = 0;
  if(tab !== "all" && !q){
    const pair = openingPair();
    rows = pair.concat(rows.filter(s => !pair.includes(s)));
    openCount = pair.length;
  }

  view = rows;

  const list = $("list");

  if(!view.length){
    list.innerHTML = SONGS.length
      ? `<li class="empty">Nothing here yet.</li>`
      : `<li class="empty"><strong>No slokams yet</strong>
           Add a line to <code>songs.txt</code> to get started.</li>`;
    return;
  }

  const playingFile = idx > -1 ? current()?.file : null;

  list.innerHTML = view.map((s, i) => {
    const here   = s.file === playingFile;
    const isOpen = i < openCount;
    const isImp  = s.tags.includes("important");
    const other  = s.tags.filter(t => t !== "important").map(label).join(" · ");

    const cls  = "track" + (isOpen ? " opener" : "")
                         + (isOpen && i === openCount - 1 ? " lastopener" : "");
    const sub  = isOpen
      ? `<span class="tagline opening">to begin</span>`
      : ((isImp || other)
          ? `<span class="tagline">${isImp ? '<span class="star">&#9670;</span>' : ""}${esc(other)}</span>`
          : "");

    return `
      <li>
        <button class="${cls}" aria-current="${here}" data-file="${esc(s.file)}">
          <span class="num">${esc(s.badge)}</span>
          <span class="meta">
            <span class="title">${esc(s.shown)}</span>
            ${sub}
          </span>
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
        </button>
      </li>`
      + (isOpen && i === openCount - 1 ? `<li class="openrule" aria-hidden="true"></li>` : "");
  }).join("");

  list.querySelectorAll(".track").forEach(b => {
    b.onclick = () => {
      const i = SONGS.findIndex(s => s.file === b.dataset.file);
      load(i, true);
    };
  });

  paintPlaying();
}

function paintPlaying(){
  const on = !audio.paused;
  document.querySelectorAll(".track").forEach(el => {
    el.classList.toggle("playing", on && el.getAttribute("aria-current") === "true");
  });
}

/* ================================================================
   Playback
   ================================================================ */
const current = () => SONGS[idx];

function load(i, autoplay){
  if(i < 0 || i >= SONGS.length) return;
  idx = i;
  const s = current();

  audio.src = s.file;
  audio.playbackRate = SPEEDS[+$("rate").value];
  clearAB();

  $("nowNum").textContent = s.badge;
  $("nowTitle").textContent = s.shown;
  $("nowTitle").classList.remove("idle");

  if("mediaSession" in navigator){
    navigator.mediaSession.metadata = new MediaMetadata({
      title: s.title ? `${s.name} — ${s.title}` : s.name,
      artist: SINGER,
      album: "Soundarya Lahari"
    });
  }

  render();
  if(autoplay) audio.play().catch(()=>{});
}

function toggle(){
  if(idx === -1){
    // nothing chosen yet — start at the top of whatever list is showing
    if(view.length) load(SONGS.findIndex(s => s.file === view[0].file), true);
    return;
  }
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
}

/* step through the list the user is currently looking at */
function step(dir){
  if(!view.length) return;
  const here = view.findIndex(s => s.file === current()?.file);
  const nextInView = view[(here + dir + view.length) % view.length];
  load(SONGS.findIndex(s => s.file === nextInView.file), true);
}

/* ================================================================
   A–B repeat
   ================================================================ */
function clearAB(){
  aPoint = bPoint = null;
  $("setA").setAttribute("aria-pressed","false");
  $("setB").setAttribute("aria-pressed","false");
  $("markA").classList.remove("on");
  $("markB").classList.remove("on");
}

function drawMarks(){
  const d = audio.duration;
  if(!d || !isFinite(d)) return;
  [["markA", aPoint], ["markB", bPoint]].forEach(([id, val]) => {
    const el = $(id);
    if(val === null){ el.classList.remove("on"); return; }
    el.classList.add("on");
    el.style.left = `calc(${(val / d) * 100}% - 1px)`;
  });
}

/* ================================================================
   Time helpers
   ================================================================ */
function mmss(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

/* ================================================================
   Wiring up the controls
   ================================================================ */
$("play").onclick = toggle;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);

$("loop").onclick = e => {
  audio.loop = !audio.loop;
  e.currentTarget.setAttribute("aria-pressed", audio.loop);
};

$("dl").onclick = () => {
  if(idx === -1) return;
  const s = current();
  const a = document.createElement("a");
  a.href = s.file;
  a.download = `Soundarya Lahari - ${s.name}`
             + (s.title ? ` - ${s.title}` : "")
             + `.${AUDIO_TYPE}`;
  document.body.appendChild(a); a.click(); a.remove();
};

$("setA").onclick = () => {
  if(idx === -1) return;
  if(aPoint !== null && bPoint === null){ clearAB(); return; }
  aPoint = audio.currentTime;
  if(bPoint !== null && bPoint <= aPoint) bPoint = null;
  $("setA").setAttribute("aria-pressed","true");
  $("setB").setAttribute("aria-pressed", bPoint !== null);
  drawMarks();
};

$("setB").onclick = () => {
  if(idx === -1) return;
  if(bPoint !== null){ bPoint = null; $("setB").setAttribute("aria-pressed","false"); drawMarks(); return; }
  if(aPoint === null) aPoint = 0;
  if(audio.currentTime <= aPoint) return;
  bPoint = audio.currentTime;
  $("setA").setAttribute("aria-pressed","true");
  $("setB").setAttribute("aria-pressed","true");
  drawMarks();
};

$("rate").oninput = e => {
  const r = SPEEDS[+e.target.value];
  audio.playbackRate = r;
  $("rateLabel").innerHTML = r.toFixed(2) + "&times;";
};

$("search").oninput = render;

/* seek bar */
$("seek").addEventListener("input", e => {
  seeking = true;
  if(audio.duration) $("cur").textContent = mmss(audio.duration * (e.target.value / 1000));
});
$("seek").addEventListener("change", e => {
  if(audio.duration) audio.currentTime = audio.duration * (e.target.value / 1000);
  seeking = false;
});

/* audio events */
audio.addEventListener("timeupdate", () => {
  if(bPoint !== null && audio.currentTime >= bPoint){
    audio.currentTime = aPoint ?? 0;
  }
  if(!seeking && audio.duration){
    $("seek").value = (audio.currentTime / audio.duration) * 1000;
    $("cur").textContent = mmss(audio.currentTime);
  }
});

audio.addEventListener("loadedmetadata", () => {
  $("dur").textContent = mmss(audio.duration);
  drawMarks();
});

audio.addEventListener("play", () => {
  $("playIcon").innerHTML = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  $("play").setAttribute("aria-label","Pause");
  paintPlaying();
});

audio.addEventListener("pause", () => {
  $("playIcon").innerHTML = '<path d="M8 5v14l11-7z"/>';
  $("play").setAttribute("aria-label","Play");
  paintPlaying();
});

audio.addEventListener("ended", () => { if(!audio.loop) step(1); });

audio.addEventListener("error", () => {
  if(idx === -1) return;
  $("nowTitle").textContent = `Can't find ${current().file}`;
  $("nowTitle").classList.add("idle");
});

/* keyboard: space plays, arrows scrub */
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA/.test(e.target.tagName);
  if(typing && e.key !== "Escape") return;

  if(e.code === "Space"){ e.preventDefault(); toggle(); }
  if(e.code === "ArrowRight" && audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
  if(e.code === "ArrowLeft"  && audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 5);
});

/* lock-screen / headphone buttons */
if("mediaSession" in navigator){
  navigator.mediaSession.setActionHandler("play",  () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", () => step(-1));
  navigator.mediaSession.setActionHandler("nexttrack",     () => step(1));
}

/* ================================================================
   Working without internet

   The app itself is kept on the phone by sw.js. The recordings are
   kept here: whatever has been played is saved automatically, and
   the button saves the whole set in one go.
   ================================================================ */
const MEDIA_CACHE = "sl-media-v1";      // must match MEDIA in sw.js

const canCache = "caches" in window && "serviceWorker" in navigator
                 && location.protocol !== "file:";

async function savedFiles(){
  try{
    const cache = await caches.open(MEDIA_CACHE);
    const keys  = await cache.keys();
    const here  = new Set(keys.map(r => new URL(r.url).pathname));
    return SONGS.filter(s => here.has(new URL(s.file, location.href).pathname)).length;
  }catch(e){ return 0; }
}

async function refreshOffline(){
  if(!canCache || !SONGS.length) return;
  const row = $("offline"), btn = $("saveAll");
  const n = await savedFiles();
  row.hidden = false;
  $("offlineText").innerHTML = n === 0
    ? `Works without internet. <b>No recordings saved yet.</b>`
    : n >= SONGS.length
      ? `<b>All ${SONGS.length} saved.</b> This works with no internet.`
      : `<b>${n} of ${SONGS.length}</b> saved for offline listening.`;
  btn.hidden = n >= SONGS.length;
  btn.disabled = false;
  btn.textContent = "Save all for offline";
}

$("saveAll").onclick = async () => {
  const btn = $("saveAll");
  btn.disabled = true;
  try{
    const cache = await caches.open(MEDIA_CACHE);
    let done = 0;
    for(const s of SONGS){
      try{ if(!await cache.match(s.file)) await cache.add(s.file); }
      catch(e){ /* one missing file should not stop the rest */ }
      done++;
      btn.textContent = `Saving ${done} of ${SONGS.length}…`;
    }
  }catch(e){}
  refreshOffline();
};

/* keep the count honest as tracks get played and cached */
audio.addEventListener("ended", () => setTimeout(refreshOffline, 400));

if(canCache){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ================================================================
   Start up
   ================================================================ */
function start(text, isDemo){
  SONGS = parseSongs(text);
  if(isDemo){
    $("notice").innerHTML =
      `<div class="notice">Showing three sample slokams. Your own list from
       <code>songs.txt</code> will appear once this is uploaded to the web.</div>`;
  }
  buildTabs();
  render();
  refreshOffline();
}

// the "?v=" stops the browser showing you an old copy after you edit songs.txt
fetch("songs.txt?v=" + Date.now())
  .then(r => { if(!r.ok) throw new Error(); return r.text(); })
  .then(t => start(t, false))
  .catch(() => start(DEMO, true));
</script>
</body>
